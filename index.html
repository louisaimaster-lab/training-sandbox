<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games Training Sandbox</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 640px;
      width: 100%;
      background: var(--card);
      border-radius: 12px;
      padding: 2.5rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      color: var(--accent);
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 9999px;
      color: var(--accent);
      font-size: 0.875rem;
      font-weight: 500;
    }
    .indicator {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
    }
    #game-container {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Training Sandbox</h1>
    <p>Sandbox initialized and deployed. Ready for the first game.</p>
    <div class="status">
      <span class="indicator"></span>
      Ready for Training
    </div>
    <div id="game-container"></div>
  </div>
</body>
</html>
