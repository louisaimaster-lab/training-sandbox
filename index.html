<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2D Pixel RPG - Heightmap Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fullscreen Pixelated RPG Canvas -->
  <canvas id="rpg-canvas"></canvas>

  <!-- In-Game Floating RPG HUD -->
  <div id="rpg-hud">
    <!-- Top Stats & Environment Bar -->
    <div class="hud-top-bar">
      <div class="rpg-frame hud-player-stats">
        <div class="stat-bar-group">
          <div class="stat-label">
            <span>❤️ HEALTH</span>
            <span id="hud-hp-text">100 / 100</span>
          </div>
          <div class="pixel-track">
            <div id="hud-hp-bar" class="pixel-fill fill-hp" style="width: 100%;"></div>
          </div>
        </div>

        <div class="stat-bar-group">
          <div class="stat-label">
            <span>⚡ STAMINA</span>
          </div>
          <div class="pixel-track">
            <div id="hud-stamina-bar" class="pixel-fill fill-stamina" style="width: 100%;"></div>
          </div>
        </div>
      </div>

      <div class="rpg-frame hud-meta-info">
        <div class="meta-pill" id="hud-elevation-text">📍 Plateau Farmland (Z:1)</div>
        <div id="hud-time-text" style="color: #fef08a;">🕒 10:30 AM</div>
      </div>
    </div>

    <!-- Bottom 10-Slot Hotbar & Active Weapon Indicator -->
    <div class="hud-bottom-bar">
      <div id="active-item-name">Iron Broadsword</div>
      <div id="hotbar-container">
        <!-- Injected via JS -->
      </div>
    </div>
  </div>

  <!-- Asset Pipeline Helper Info -->
  <div id="asset-guide-tag">
    <strong>🎨 Custom Pixel Art:</strong><br>
    Drop your <code>.png</code> files into <code>assets/</code><br>
    Controls: <strong>WASD</strong> Move | <strong>Space/Click</strong> Action | <strong>1-9</strong> Hotbar | <strong>H</strong> Heal
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
